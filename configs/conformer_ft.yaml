# Fine-tune the CONFORMER on simulator v2 (added after the first real off-air benchmark, 2 Oct 2026).
# v2 = what real beacon recordings showed the v1 simulator was missing:
#   * fast, deep fading: real 14 MHz signals swung 20-34 dB within one second (~3 fades/s);
#     v1 faded only 30% of clips at 0.05-1.5 Hz  ->  60% of clips, 0.1-8 Hz log-uniform, Rayleigh-like
#   * "nothing decodable" examples: below about -14 dB the models hallucinated ham phrases (CQ, TEST, TNX)
#     ->  5% noise-only clips with an empty label, and SNR down to -20 dB
#   * less language prior: more random characters and bare callsigns, fewer QSO templates
#   * receiver low-cut varies (real receivers pass audio down to ~50 Hz)
run_name: conformer_ft

model:
  arch: conformer
  conv_channels: [32, 64, 128]
  conv_dim: 144
  dropout: 0.1
  frontend: {n_fft: 256, win_length: 200, hop_length: 64, fmin: 200.0, fmax: 1400.0}
  # attn_dropout 0: dropout inside attention forces a slow attention kernel (2x slower on an RTX 4050),
  # and with endless synthetic data there is nothing to overfit anyway
  encoder: {d_model: 144, layers: 8, heads: 4, ff_mult: 4, kernel: 15, dropout: 0.1, attn_dropout: 0.0}

synth:
  sample_rate: 8000
  clip_seconds: 8.0
  wpm_range: [12, 45]
  p_fading: 0.6
  fade_rate_hz_range: [0.1, 8.0]
  fade_rate_dist: loguniform
  rician_k_range: [0.0, 3.0]
  p_empty: 0.05
  rx_lowcut_range: [50.0, 300.0]
  text_mix: {qso: 0.2, contest: 0.1, words: 0.2, random: 0.3, callsign: 0.2}

train:
  batch_size: 32             # per micro-batch; fits a 6 GB laptop GPU
  accum_steps: 2             # 2 x 32 = effective batch 64. On a >=10 GB GPU use batch_size 64, accum_steps 1
  steps: 15000
  init_from: runs/conformer/best.pt      # start from the v1 model
  lr: 2.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 500
  grad_clip: 5.0
  amp: true
  amp_dtype: auto           # auto = bf16 on Ampere (RTX 30xx) or newer, else fp16
  num_workers: 8
  log_every: 100
  val_every: 2000
  val_size: 1000
  seed: 0
  # Real recordings monitored at every validation (folders or labels.csv files), e.g.
  #   real_val: [real_data/beacons/rec1, real_data/w1aw]
  real_val: [real_data/beacons/20261002T144948Z_14099300_usb]   # monitor set (used to design v2, so not a test set)
  select_on: synthetic       # 'real' picks best.pt by real CER -- then keep a separate real TEST set
  curriculum:
    - {until_step: 3000,  snr_db_range: [-14, 30]}
    - {until_step: 15000, snr_db_range: [-20, 30]}
