# Conv front-end + Conformer + CTC  (~4.4M params). Usually beats the CRNN at low SNR.
run_name: conformer

model:
  arch: conformer
  conv_channels: [32, 64, 128]
  conv_dim: 144
  dropout: 0.1
  frontend: {n_fft: 256, win_length: 200, hop_length: 64, fmin: 200.0, fmax: 1400.0}
  # attn_dropout 0: head dim 144/4 = 36 is not a multiple of 8, so PyTorch's fused attention kernels can't
  # run and attention uses the plain "math" path. There, dropout keeps an extra (B, heads, T, T) tensor per
  # layer for the backward pass: peak memory 5.6 vs 4.5 GB at batch 32, which overflows a 6 GB laptop GPU
  # into system RAM and halves the speed (scripts/speed_dropout.py). With endless synthetic data there is
  # nothing to overfit, so attention dropout is not needed.
  encoder: {d_model: 144, layers: 8, heads: 4, ff_mult: 4, kernel: 15, dropout: 0.1, attn_dropout: 0.0}

synth:
  sample_rate: 8000
  clip_seconds: 8.0
  wpm_range: [12, 45]

train:
  batch_size: 32             # per micro-batch; fits a 6 GB laptop GPU
  accum_steps: 2             # 2 x 32 = effective batch 64. On a >=10 GB GPU use batch_size 64, accum_steps 1
  steps: 80000
  lr: 5.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 2000
  grad_clip: 5.0
  amp: true
  amp_dtype: auto           # auto = bf16 on Ampere (RTX 30xx) or newer, else fp16
  num_workers: 8
  log_every: 100
  val_every: 2000
  val_size: 1000
  seed: 0
  # Real recordings monitored at every validation (folders or labels.csv files), e.g.
  #   real_val: [real_data/beacons/rec1, real_data/w1aw]
  real_val: []
  select_on: synthetic       # 'real' picks best.pt by real CER -- then keep a separate real TEST set
  curriculum:
    - {until_step: 5000,  snr_db_range: [10, 30]}
    - {until_step: 15000, snr_db_range: [0, 30]}
    - {until_step: 30000, snr_db_range: [-8, 30]}
    - {until_step: 80000, snr_db_range: [-14, 30]}
